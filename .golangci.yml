version: "2"

linters:
  settings:
    errcheck:
      exclude-functions:
        # The validation and formula collectors record a problem and return it for a caller that
        # adds a hint; recording cannot fail, so most calls drop the result.
        - (*github.com/emoss08/keel/analytics/ir.collector).add
        - (*github.com/emoss08/keel/analytics/formula.checker).fail
        # Help text, event lines and cache keys written to a terminal, a log or a hash: a failed
        # terminal write has nowhere to be reported, and a hash's Write never fails.
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - io.WriteString
    staticcheck:
      checks:
        - all
        # golangci-lint's defaults: package comments, naming and receiver-name style.
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        # De Morgan's law: a negated condition often reads closer to the rule it checks.
        - -QF1001
        # Printing a []T whose T has a String method as a string would drop the names.
        - -QF1010
  exclusions:
    rules:
      # Tests close their connections, servers and files in deferred cleanup, where a failed
      # close has no effect on what the test checks.
      - path: _test\.go
        linters:
          - errcheck
