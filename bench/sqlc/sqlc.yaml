version: "2"
sql:
  - engine: postgresql
    schema: schema.sql
    queries: queries.sql
    gen:
      go:
        package: sqlcdb
        out: ../sqlcdb
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        overrides:
          - db_type: jsonb
            go_type:
              import: github.com/emoss08/keel/bench/benchjson
              type: Map
